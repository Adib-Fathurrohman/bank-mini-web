# Customer app (mobile-app web build) + the same Laravel API on its own origin,
# so the app calls /api without CORS.
# /etc/nginx/sites-available/app.rumput.tech, then: certbot --nginx -d app.rumput.tech
server {
    listen 80;
    listen [::]:80;
    server_name app.rumput.tech;

    root /var/www/bank-mini-app;
    index index.html;
    client_max_body_size 1m;

    location ~ ^/api(/|$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/bank-mini-laravel/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    # Expo's hashed bundles and assets never change.
    location ~ ^/(_expo|assets)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
