# Staff web app (front-end) + Laravel API on one origin.
# /etc/nginx/sites-available/bank.rumput.tech, then: certbot --nginx -d bank.rumput.tech
server {
    listen 80;
    listen [::]:80;
    server_name bank.rumput.tech;

    root /var/www/bank-mini-frontend;
    index index.html;
    client_max_body_size 10m;

    # Laravel: API and health check (bank-mini-laravel/docs/DEPLOY.md)
    location ~ ^/(api|up)(/|$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/bank-mini-laravel/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    # Vite's hashed files never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app: every other path is index.html, never cached.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
