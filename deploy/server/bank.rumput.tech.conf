# Rumput Bank Mini staff web app (static React build), served under /api/.
# Files: /var/www/rumput/bank-mini/staff/current (deploy-staff.sh). See DEPLOY.md.
# The API itself is https://api-bank.rumput.tech (its own vhost).
server {
    listen 80;
    listen [::]:80;
    server_name bank.rumput.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/rumput/bank-mini/tmp/acme;
        default_type text/plain;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bank.rumput.tech;

    ssl_certificate     /etc/letsencrypt/live/bank.rumput.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bank.rumput.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    charset utf-8;
    access_log /var/log/nginx/bank.rumput.tech.access.log;
    error_log  /var/log/nginx/bank.rumput.tech.error.log;

    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

    # Repeated in every location that adds its own headers (nginx does not inherit them).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # The app lives under /api/ (its Vite base and router basename).
    location = /    { return 302 /api/; }
    location = /api { return 301 /api/; }

    # Hashed build files: cache for a year; a missing file is a 404, never index.html.
    location ^~ /api/assets/ {
        alias /var/www/rumput/bank-mini/staff/current/assets/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location = /api/index.html {
        alias /var/www/rumput/bank-mini/staff/current/index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Real files (favicon.svg) as files; every other path is a client route -> index.html.
    location ^~ /api/ {
        alias /var/www/rumput/bank-mini/staff/current/;
        location ~ /\. { deny all; }
        try_files $uri /api/index.html;
    }

    location ~ /\. { deny all; }
    location / { return 404; }
}
